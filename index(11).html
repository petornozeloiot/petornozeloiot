function buildMonthOptions(cases, startYM = "2025-01") {
  const set = new Set();
  for (let y = 2025; y <= 2028; y++) {
    for (let m = 1; m <= 12; m++) {
      const ym = `${y}-${String(m).padStart(2, "0")}`;
      if (ym >= startYM) set.add(ym);
    }
  }
  cases.forEach((c) => {
    const d = c.surgeryDate || c.referralDate;
    if (d && d.slice(0, 7) >= startYM) set.add(d.slice(0, 7));
  });
  return Array.from(set).sort();
}

// ---------- Storage helpers (Supabase) ----------
async function loadCases() {
  try {
    const { data, error } = await sb.from("app_storage").select("value").eq("key", "cases").maybeSingle();
    if (error || !data) return [];
    return data.value || [];
  } catch (e) {
    console.error("Erro ao carregar casos", e);
    return [];
  }
}
async function saveCases(cases) {
  try {
    await sb.from("app_storage").upsert({ key: "cases", value: cases, updated_at: new Date().toISOString() });
  } catch (e) {
    console.error("Erro ao salvar casos", e);
  }
}
async function loadTables() {
  try {
    const { data, error } = await sb.from("app_storage").select("value").eq("key", "reference-tables").maybeSingle();
    if (error || !data) return { discounts: DEFAULT_DISCOUNT_TABLE, anesth: DEFAULT_ANESTH_TABLE };
    return data.value || { discounts: DEFAULT_DISCOUNT_TABLE, anesth: DEFAULT_ANESTH_TABLE };
  } catch (e) {
    console.error("Erro ao carregar tabelas", e);
    return { discounts: DEFAULT_DISCOUNT_TABLE, anesth: DEFAULT_ANESTH_TABLE };
  }
}
async function saveTables(tables) {
  try {

}

// ---------- Derived value calculations ----------
function computeValues(c) {
  const hospital = Number(c.hospitalValue) || 0;
  const doctor = Number(c.doctorValue) || 0;
  const anesth = Number(c.anesthesistValue) || 0;
  const internist = doctor * 0.02;
  const additional = Number(c.additionalValue) || 0;
  const patientTotal = hospital + doctor + anesth;
  return { hospital, doctor, anesth, internist, additional, patientTotal };
}

function stageIndex(stage) {
  return STAGES.findIndex((s) => s.key === stage);
}

        <React.Fragment key={s.key}>
          <div className="flex flex-col items-center gap-1 flex-1">

              className={`w-2.5 h-2.5 rounded-full border-2 ${
                i <= idx
                  ? closed && i === STAGES.length - 1
                    ? "bg-emerald-500 border-emerald-500"
                    : "bg-[#1B3A4B] border-[#1B3A4B]"
                  : "bg-white border-slate-300"
              }`}
            />
            <span className={`text-[10px] leading-none ${i <= idx ? "text-[#1B3A4B] font-medium" : "text-slate-400"}`}>

  );
}

function App() {
  const [cases, setCases] = useState([]);
  const [tables, setTables] = useState({ discounts: DEFAULT_DISCOUNT_TABLE, anesth: DEFAULT_ANESTH_TABLE });
  const [view, setView] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [monthFilter, setMonthFilter] = useState("todos");
  const [doctorFilter, setDoctorFilter] = useState("todos");
  const [search, setSearch] = useState("");
  const [prefillDoctor, setPrefillDoctor] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState("todos");
  const [history, setHistory] = useState([]);

  const currentNavState = () => ({ view, selectedId, doctorFilter, prefillDoctor, categoryFilter });

  const goTo = (patch) => {
    setHistory((h) => [...h, currentNavState()]);
    if (patch.view !== undefined) setView(patch.view);
    if ("selectedId" in patch) setSelectedId(patch.selectedId);
    if ("doctorFilter" in patch) setDoctorFilter(patch.doctorFilter);
    if ("prefillDoctor" in patch) setPrefillDoctor(patch.prefillDoctor);
    if ("categoryFilter" in patch) setCategoryFilter(patch.categoryFilter);
  };

  const goBack = () => {
    setHistory((h) => {
      if (h.length === 0) return h;
      const prev = h[h.length - 1];
      setView(prev.view);
      setSelectedId(prev.selectedId);
      setDoctorFilter(prev.doctorFilter);
      setPrefillDoctor(prev.prefillDoctor);
      setCategoryFilter(prev.categoryFilter);
      return h.slice(0, -1);
    });
  };

  useEffect(() => {
    (async () => {
      const [c, t] = await Promise.all([loadCases(), loadTables()]);
      setCases(c);
      setTables(t);
      setLoading(false);
    })();
  }, []);

  const persist = async (next) => {
    setCases(next);
    await saveCases(next);
  };

  const upsertCase = async (c) => {
    const existing = cases.find((x) => x.id === c.id);
    const today = new Date().toISOString();
    let updated = { ...c };
    if (updated.closed && !existing?.closed) {
      updated.closedAt = today;
    } else if (!updated.closed) {
      updated.closedAt = "";
    } else if (updated.closed && !updated.closedAt) {
      updated.closedAt = today;
    }
    if (updated.paymentStatus === "pago" && existing?.paymentStatus !== "pago") {
      updated.paidAt = today;
    } else if (updated.paymentStatus !== "pago") {
      updated.paidAt = "";
    } else if (updated.paymentStatus === "pago" && !updated.paidAt) {
      updated.paidAt = today;
    }
    const exists = cases.some((x) => x.id === updated.id);
    const next = exists ? cases.map((x) => (x.id === updated.id ? updated : x)) : [...cases, updated];
    await persist(next);
  };

  const deleteCase = async (id) => {
    const next = cases.filter((x) => x.id !== id);
    await persist(next);
  };

  const months = useMemo(() => buildMonthOptions(cases, "2026-08"), [cases]);

  const filtered = useMemo(() => {
    return cases.filter((c) => {
      const isPendente = !c.closed && !c.surgeryDate;
      const refMonth = (c.surgeryDate || c.referralDate || "").slice(0, 7);
      if (!isPendente && monthFilter !== "todos" && refMonth !== monthFilter) return false;
      if (doctorFilter !== "todos" && c.referringDoctor !== doctorFilter) return false;
      if (search && !c.patientName.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }, [cases, monthFilter, doctorFilter, search]);

  const indicators = useMemo(() => {
    const agendadas = filtered.filter((c) => c.surgeryDate && !c.closed).length;
    const pendentes = filtered.filter((c) => !c.closed && !c.surgeryDate).length;
    const fechadas = filtered.filter((c) => c.closed).length;
    const pagas = filtered.filter((c) => c.paymentStatus === "pago").length;
    return { agendadas, pendentes, fechadas, pagas };
  }, [filtered]);

  const overallIndicators = useMemo(() => {
    const agendadas = cases.filter((c) => c.surgeryDate && !c.closed).length;
    const pendentes = cases.filter((c) => !c.closed && !c.surgeryDate).length;
    const fechadas = cases.filter((c) => c.closed).length;
    const pagas = cases.filter((c) => c.paymentStatus === "pago").length;
    return { agendadas, pendentes, fechadas, pagas };
  }, [cases]);

  const perDoctorCounts = useMemo(() => {
    const map = {};
    DOCTORS.forEach((d) => {
      const list = cases.filter((c) => c.referringDoctor === d);
      const totals = list.reduce(
        (acc, c) => {
          const v = computeValues(c);
          acc.hospital += v.hospital;
          acc.doctor += v.doctor;
          acc.anesth += v.anesth;
          return acc;
        },
        { hospital: 0, doctor: 0, anesth: 0 }
      );
      map[d] = {
        total: list.length,
        pendentes: list.filter((c) => !c.closed).length,
        fechadas: list.filter((c) => c.closed).length,
        ...totals,
      };
    });
    return map;
  }, [cases]);

  return (
    <div className="min-h-screen bg-[#F5F6F8] text-slate-800">
      <TopBar view={view} setView={(v) => goTo({ view: v })} />
      <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6">
        {history.length > 0 && (
          <button
            onClick={goBack}
            className="flex items-center gap-1 text-sm text-[#2E8B8B] hover:underline mb-4 print:hidden"
          >
            <ChevronLeft className="w-4 h-4" /> Voltar
          </button>
        )}
        {loading ? (
          <div className="text-center py-24 text-slate-400 text-sm">Carregando dados…</div>
        ) : view === "dashboard" ? (
          doctorFilter === "todos" ? (
            <OverviewPanel
              overallIndicators={overallIndicators}
              perDoctorCounts={perDoctorCounts}
              onSelectDoctor={(d) => goTo({ doctorFilter: d, categoryFilter: "todos" })}
              onNewPatient={(d) => {
                goTo({ selectedId: null, prefillDoctor: d || null, view: "form" });
              }}
            />
          ) : (
            <Dashboard
              indicators={indicators}
              cases={filtered}
              months={months}
              monthFilter={monthFilter}
              setMonthFilter={setMonthFilter}
              doctorFilter={doctorFilter}
              setDoctorFilter={setDoctorFilter}
              categoryFilter={categoryFilter}
              setCategoryFilter={setCategoryFilter}
              onOpen={(id) => {
                goTo({ selectedId: id, view: "detalhe" });
              }}
            />
          )
        ) : view === "casos" ? (
          <CaseList
            cases={filtered}
            search={search}
            setSearch={setSearch}
            doctorFilter={doctorFilter}
            setDoctorFilter={setDoctorFilter}
            onOpen={(id) => {
              goTo({ selectedId: id, view: "detalhe" });
            }}
            onNew={() => {
              goTo({ selectedId: null, view: "form" });
            }}
          />
        ) : view === "form" ? (
          <CaseForm
            initial={selectedId ? cases.find((c) => c.id === selectedId) : { ...emptyCase(), referringDoctor: prefillDoctor || DOCTORS[0] }}
            tables={tables}
            onCancel={() => goBack()}
            onSave={async (c) => {
              await upsertCase(c);
              goTo({ selectedId: c.id, view: "detalhe" });
            }}
          />
        ) : view === "detalhe" ? (
          <CaseDetail
            caseData={cases.find((c) => c.id === selectedId)}
            onBack={() => goBack()}
            onEdit={() => goTo({ view: "form" })}
            onDelete={async (id) => {
              await deleteCase(id);
              goTo({ selectedId: null, view: "casos" });
            }}
          />
        ) : view === "agenda" ? (
          <AgendaDia
            cases={cases}
            onOpen={(id) => {
              goTo({ selectedId: id, view: "detalhe" });
            }}
          />
        ) : view === "relatorios" ? (
          <Reports cases={cases} />
        ) : view === "caixa" ? (
          <CaixaMedico cases={cases} />
        ) : null}
      </main>
    </div>
  );
}

// ---------- Dashboard ----------
function Dashboard({ indicators, cases, months, monthFilter, setMonthFilter, doctorFilter, setDoctorFilter, categoryFilter, setCategoryFilter, onOpen }) {

  const cards = [
    { key: "agendadas", label: "Agendadas", value: indicators.agendadas, icon: Calendar, tone: "blue" },
    { key: "pendentes", label: "Pendentes", value: indicators.pendentes, icon: Clock, tone: "amber" },
    { key: "fechadas", label: "Fechadas", value: indicators.fechadas, icon: Check, tone: "teal" },
    { key: "pagas", label: "Pagas", value: indicators.pagas, icon: DollarSign, tone: "green" },
  ];
  const toneMap = {
    blue: "bg-sky-50 text-sky-700 border-sky-100",
    amber: "bg-amber-50 text-amber-700 border-amber-100",
    teal: "bg-teal-50 text-teal-700 border-teal-100",
    green: "bg-emerald-50 text-emerald-700 border-emerald-100",
  };

  const categoryMatch = (c) => {
    if (categoryFilter === "agendadas") return c.surgeryDate && !c.closed;
    if (categoryFilter === "pendentes") return !c.closed && !c.surgeryDate;
    if (categoryFilter === "fechadas") return c.closed;
    if (categoryFilter === "pagas") return c.paymentStatus === "pago";
    return true;
  };
  let filteredCases = cases.filter(categoryMatch);
  if (categoryFilter === "agendadas") {
    filteredCases = filteredCases.slice().sort((a, b) => (a.surgeryDate || "").localeCompare(b.surgeryDate || ""));
  } else if (categoryFilter === "pendentes") {
    filteredCases = filteredCases.slice().sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
  } else if (categoryFilter === "fechadas") {
    filteredCases = filteredCases.slice().sort((a, b) => (b.closedAt || "").localeCompare(a.closedAt || ""));
  } else if (categoryFilter === "pagas") {
    filteredCases = filteredCases.slice().sort((a, b) => (b.paidAt || "").localeCompare(a.paidAt || ""));
  }

  return (
    <div className="space-y-6">
      <button
        onClick={() => setDoctorFilter("todos")}
        className="flex items-center gap-1.5 text-sm font-medium text-[#1B3A4B] bg-white border border-slate-200 rounded-lg px-3 py-2 hover:bg-slate-50 hover:border-[#2E8B8B] transition-colors"
      >
        <ChevronLeft className="w-4 h-4" /> Voltar para visão geral do serviço
      </button>

      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="font-serif text-2xl text-[#12242F]">{doctorFilter}</h2>
        <div className="flex items-center gap-2">
          <select value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)} className={inputCls + " w-auto"}>
            <option value="todos">Todos os meses</option>
            {months.map((m) => (
              <option key={m} value={m}>
                {MONTHS[Number(m.slice(5, 7)) - 1]}/{m.slice(0, 4)}
              </option>
            ))}
          </select>
          <select value={doctorFilter} onChange={(e) => setDoctorFilter(e.target.value)} className={inputCls + " w-auto"}>
            <option value="todos">Todos os médicos</option>
            {DOCTORS.map((d) => (
              <option key={d} value={d}>
                {d}
              </option>
            ))}
          </select>
        </div>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {cards.map((c) => (
          <button
            key={c.key}
            onClick={() => setCategoryFilter(categoryFilter === c.key ? "todos" : c.key)}
            className={`text-left rounded-xl border p-4 transition-all ${toneMap[c.tone]} ${
              categoryFilter === c.key ? "ring-2 ring-offset-1 ring-[#1B3A4B]" : "hover:shadow-sm"
            }`}
          >
            <div className="flex items-center justify-between mb-2">
              <c.icon className="w-4 h-4 opacity-70" />
            </div>
            <div className="text-3xl font-serif">{c.value}</div>
            <div className="text-xs font-medium uppercase tracking-wide opacity-80">{c.label}</div>
          </button>
        ))}
      </div>

      <div>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-wide">
            {categoryFilter === "todos" ? "Casos no filtro atual" : cards.find((c) => c.key === categoryFilter)?.label} ({filteredCases.length})
          </h3>
          {categoryFilter !== "todos" && (
            <button onClick={() => setCategoryFilter("todos")} className="text-xs text-[#2E8B8B] hover:underline">
              Ver todos
            </button>
          )}
        </div>
        {categoryFilter === "pendentes" && (
          <p className="text-xs text-slate-400 -mt-2 mb-3">
            Mostrando todos os pendentes, de qualquer mês (inclusive anteriores) — o filtro de mês não se aplica aqui.
          </p>
        )}
        {filteredCases.length === 0 ? (
          <div className="text-center py-16 text-slate-400 text-sm bg-white rounded-xl border border-slate-200">
            Nenhum caso encontrado para esse filtro.
          </div>
        ) : (
          <div className="space-y-2">
            {filteredCases.map((c) => (
              <CaseRow key={c.id} c={c} onOpen={() => onOpen(c.id)} categoryFilter={categoryFilter} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function CaseRow({ c, onOpen, categoryFilter }) {
  const v = computeValues(c);
  return (
    <button
      onClick={onOpen}
      className="w-full text-left bg-white border border-slate-200 rounded-xl p-4 hover:border-[#2E8B8B] transition-colors flex items-center gap-4"
    >
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 mb-1">
          <span className="font-medium text-slate-800 truncate">{c.patientName || "(sem nome)"}</span>
          {c.surgeryDate && (
            <Badge tone="blue">
              <Calendar className="w-3 h-3" /> {c.surgeryDate.split("-").reverse().join("/")}{c.surgeryTime ? ` ${c.surgeryTime}` : ""}
            </Badge>
          )}
          {categoryFilter === "pendentes" && c.createdAt && (
            <Badge tone="slate">
              Lançado em {new Date(c.createdAt).toLocaleDateString("pt-BR")}
            </Badge>
          )}
          {categoryFilter === "fechadas" && c.closedAt && (
            <Badge tone="teal">
              Fechada em {new Date(c.closedAt).toLocaleDateString("pt-BR")}
            </Badge>
          )}
          {categoryFilter === "pagas" && c.paidAt && (
            <Badge tone="green">
              Paga em {new Date(c.paidAt).toLocaleDateString("pt-BR")}
            </Badge>
          )}
          {c.closed && <Badge tone="teal">Fechada</Badge>}
          {c.paymentStatus === "pago" && <Badge tone="green">Paga</Badge>}
          {c.discountGiven && <Badge tone="amber">Desconto</Badge>}
        </div>
        <div className="text-xs text-slate-500">{c.referringDoctor} · {c.surgeryType || "tipo não informado"}</div>
        <div className="text-xs text-slate-500 mt-1 flex flex-wrap gap-x-3">
          <span>Hospital: {currency(v.hospital)}</span>
          <span>Médico: {currency(v.doctor)}</span>
          <span>Anestesista: {currency(v.anesth)}</span>
        </div>
      </div>
      <div className="hidden sm:block w-40">
        <StageTrack stage={c.stage} closed={c.closed} />
      </div>
      <ChevronRight className="w-4 h-4 text-slate-300 flex-shrink-0" />
    </button>
  );
}

    { key: "agendadas", label: "Agendadas" },
    { key: "pendentes", label: "Pendentes" },
    { key: "fechadas", label: "Fechadas" },
    { key: "pagas", label: "Pagas" },
  ];

  const statusMatch = (c) => {
    if (statusFilter === "agendadas") return c.surgeryDate && !c.closed;
    if (statusFilter === "pendentes") return !c.closed && !c.surgeryDate;
    if (statusFilter === "fechadas") return c.closed;
    if (statusFilter === "pagas") return c.paymentStatus === "pago";

      <div className="flex flex-wrap gap-2">

        <div className="space-y-2">
          {visibleCases.map((c) => (
            <CaseRow key={c.id} c={c} onOpen={() => onOpen(c.id)} categoryFilter={statusFilter} />
          ))}
        </div>
      )}
    </div>
  );
}

    <div className="space-y-6 max-w-3xl">

            >
              Excluir
            </button>
          )}

            onClick={onEdit}
            className="text-sm bg-[#1B3A4B] text-white px-4 py-2 rounded-lg hover:bg-[#12242F]"
          >
            Editar caso
          </button>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-6 space-y-6">
        <div>
          <h2 className="font-serif text-2xl text-[#12242F]">{caseData.patientName}</h2>

function toCSV(rows) {
  const escape = (v) => {
    const s = String(v ?? "");
    return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return rows.map((row) => row.map(escape).join(";")).join("\r\n");
}

function downloadCSV(filename, rows) {
  const csv = "\uFEFF" + toCSV(rows);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const DOCTOR_DOT_COLORS = {
  [DOCTORS[0]]: "bg-sky-500",
  [DOCTORS[1]]: "bg-teal-500",
  [DOCTORS[2]]: "bg-amber-500",
};
const WEEKDAYS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

function buildCalendarWeeks(year, month) {
  // month is 1-12
  const first = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const startOffset = first.getDay();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

function AgendaDia({ cases, onOpen }) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const [mode, setMode] = useState("dia");
  const [doctor, setDoctor] = useState("todos");
  const [date, setDate] = useState(todayStr);
  const [calMonth, setCalMonth] = useState(todayStr.slice(0, 7));

  const results = useMemo(() => {
    return cases
      .filter((c) => c.surgeryDate === date)
      .filter((c) => doctor === "todos" || c.referringDoctor === doctor)
      .sort((a, b) => (a.surgeryTime || "").localeCompare(b.surgeryTime || ""));
  }, [cases, doctor, date]);

  const formattedDate = useMemo(() => {
    if (!date) return "";
    const [y, m, d] = date.split("-");
    return `${d}/${m}/${y}`;
  }, [date]);

  const [calYear, calMonthNum] = calMonth.split("-").map(Number);
  const weeks = useMemo(() => buildCalendarWeeks(calYear, calMonthNum), [calYear, calMonthNum]);

  const casesByDay = useMemo(() => {
    const map = {};
    cases
      .filter((c) => c.surgeryDate && c.surgeryDate.slice(0, 7) === calMonth)
      .filter((c) => doctor === "todos" || c.referringDoctor === doctor)
      .forEach((c) => {
        const day = Number(c.surgeryDate.slice(8, 10));
        if (!map[day]) map[day] = [];
        map[day].push(c);
      });
    return map;
  }, [cases, calMonth, doctor]);

  const shiftMonth = (delta) => {
    const d = new Date(calYear, calMonthNum - 1 + delta, 1);
    setCalMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  return (

            Dia

                  <option key={d} value={d}>
                    {d}
                  </option>
                ))}
              </select>
            </Field>
            <button onClick={() => setDate(todayStr)} className="text-sm text-[#2E8B8B] hover:underline px-1 py-2">
              Hoje
            </button>
          </div>

          <div>
            <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-3">
              Cirurgias em {formattedDate} ({results.length})
            </h3>
            {results.length === 0 ? (
              <div className="text-center py-16 text-slate-400 text-sm bg-white rounded-xl border border-slate-200">
                Nenhuma cirurgia agendada para esse dia.
              </div>
            ) : (
              <div className="space-y-2">
                {results.map((c) => {
                  const v = computeValues(c);
                  return (
                    <button

        </>
      )}
    </div>
  );
}

function CaixaMedico({ cases }) {
  const [doctor, setDoctor] = useState("todos");
  const [monthFilter, setMonthFilter] = useState("todos");
  const [statusFilter, setStatusFilter] = useState("fechadas");
  const [invoiceFilter, setInvoiceFilter] = useState("todos");

  const months = useMemo(() => {
    const set = new Set();
    for (let y = 2026; y <= 2028; y++) {
      for (let m = 1; m <= 12; m++) {
        if (y === 2026 && m < 8) continue;
        set.add(`${y}-${String(m).padStart(2, "0")}`);
      }
    }
    cases.forEach((c) => {
      const d = c.surgeryDate || c.referralDate;
      if (d && d.slice(0, 7) >= "2026-08") set.add(d.slice(0, 7));
    });
    return Array.from(set).sort();
  }, [cases]);

  const allEntries = useMemo(() => {
    return cases
      .filter((c) => doctor === "todos" || c.referringDoctor === doctor)
      .map((c) => {
        const v = computeValues(c);
        return {
          id: c.id,
          patientName: c.patientName,
          doctor: c.referringDoctor,
          date: c.surgeryDate || c.referralDate || "",
          doctorValue: v.doctor,
          secretaryPercent: v.doctor * 0.02,
          paymentStatus: c.paymentStatus,
          paymentMethod: c.paymentMethod,
          hasInvoice: c.hasInvoice,
          closed: c.closed,
        };
      })
      .filter((e) => monthFilter === "todos" || e.date.slice(0, 7) === monthFilter)
      .filter((e) => invoiceFilter === "todos" || e.hasInvoice === invoiceFilter)
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [cases, doctor, monthFilter, invoiceFilter]);

  const fechadasList = allEntries.filter((e) => e.closed);
  const pendentesList = allEntries.filter((e) => !e.closed);
  const entries = statusFilter === "fechadas" ? fechadasList : pendentesList;

  const totals = entries.reduce(
    (acc, e) => {
      acc.doctorValue += e.doctorValue;
      acc.secretaryPercent += e.secretaryPercent;
      return acc;
    },
    { doctorValue: 0, secretaryPercent: 0 }
  );

  const handleExport = () => {

function buildMonthRange(startYM, endYM) {
  const [sy, sm] = startYM.split("-").map(Number);
  const [ey, em] = endYM.split("-").map(Number);
  const out = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    out.push(`${y}-${String(m).padStart(2, "0")}`);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return out;
}

function DoctorMonthlyChart({ doctor, cases }) {
  const todayYM = new Date().toISOString().slice(0, 7);
  let startYM = "2026-08";
  let endYM = todayYM;
  cases.forEach((c) => {
    if (c.referralDate) {
      const m = c.referralDate.slice(0, 7);
      if (m < startYM) startYM = m;
      if (m > endYM) endYM = m;
    }
  });
  if (startYM < "2026-08") startYM = "2026-08";
  const monthsRange = buildMonthRange(startYM, endYM);

  // Agrupamento por "coorte": tudo contado no mês em que a cirurgia foi INDICADA,
  // independente de para quando ela foi agendada ou quando fechou.
  const data = monthsRange.map((m) => {
    const referredThisMonth = cases.filter((c) => c.referralDate && c.referralDate.slice(0, 7) === m);
    const indicadas = referredThisMonth.length;
    const agendadas = referredThisMonth.filter((c) => c.surgeryDate).length;
    const fechadas = referredThisMonth.filter((c) => c.closed).length;
    // cada caso conta só 1 vez no % produtivo, mesmo que esteja agendado E fechado ao mesmo tempo
    const produtivas = referredThisMonth.filter((c) => c.surgeryDate || c.closed).length;
    const produtivo = indicadas > 0 ? Math.round((produtivas / indicadas) * 100) : 0;
    const perda = indicadas > 0 ? 100 - produtivo : 0;
    return { m, indicadas, agendadas, fechadas, produtivas, produtivo, perda };
  });

  const totals = data.reduce(
    (acc, d) => ({ indicadas: acc.indicadas + d.indicadas, produtivas: acc.produtivas + d.produtivas }),
    { indicadas: 0, produtivas: 0 }
  );
  const overallProdutivo = totals.indicadas > 0 ? Math.round((totals.produtivas / totals.indicadas) * 100) : 0;
  const overallPerda = totals.indicadas > 0 ? 100 - overallProdutivo : 0;

  const max = Math.max(1, ...data.map((d) => Math.max(d.indicadas, d.agendadas, d.fechadas)));
  const chartH = 220, leftPad = 32, topPad = 44, rightPad = 20;
  const groupW = 90, barW = 22, barGap = 5;
  const width = Math.max(280, leftPad + rightPad + monthsRange.length * groupW);

  const groupXFor = (i) => leftPad + i * groupW;
  const yFor = (v) => topPad + chartH - (v / max) * chartH;

  const series = [
    { key: "indicadas", color: "#64748b", label: "Indicadas" },
    { key: "agendadas", color: "#0ea5e9", label: "Agendadas" },
    { key: "fechadas", color: "#0d9488", label: "Fechadas" },
  ];

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <h4 className="text-base font-semibold text-slate-700">{doctor}</h4>
        {data.length > 0 && (
          <>
            <Badge tone={overallProdutivo >= 70 ? "green" : overallProdutivo >= 40 ? "amber" : "slate"}>
              {overallProdutivo}% produtivo no período
            </Badge>
            <Badge tone={overallPerda >= 40 ? "red" : "slate"}>{overallPerda}% perda cirúrgica</Badge>
          </>
        )}
      </div>
      {data.length === 0 ? (
        <p className="text-xs text-slate-400">Sem dados suficientes ainda para este médico.</p>
      ) : (
        <>
          <div className="overflow-x-auto">
            <svg width={width} height={chartH + topPad + 26}>
              {[0, 0.5, 1].map((frac) => (
                <line
                  key={frac}
                  x1={leftPad}
                  y1={topPad + chartH * (1 - frac)}
                  x2={width - rightPad}
                  y2={topPad + chartH * (1 - frac)}
                  stroke="#f1f5f9"
                  strokeWidth="1"
                />
              ))}
              {data.map((d, i) => {
                const gx = groupXFor(i);
                const groupCenter = gx + (barW * 3 + barGap * 2) / 2;
                const pctColor = d.produtivo >= 70 ? "#0d9488" : d.produtivo >= 40 ? "#b45309" : "#64748b";
                return (
                  <g key={d.m}>
                    <text x={groupCenter} y={topPad - 24} textAnchor="middle" fontSize="13" fontWeight="700" fill={pctColor}>
                      {d.produtivo}% prod.
                    </text>
                    <text x={groupCenter} y={topPad - 10} textAnchor="middle" fontSize="11" fontWeight="600" fill="#dc2626">
                      {d.perda}% perda
                    </text>
                    {series.map((s, si) => {
                      const bx = gx + si * (barW + barGap);
                      const h = (d[s.key] / max) * chartH;
                      return (
                        <g key={s.key}>
                          <rect x={bx} y={topPad + chartH - h} width={barW} height={h} fill={s.color} rx="2" />
                          {d[s.key] > 0 && (
                            <text x={bx + barW / 2} y={topPad + chartH - h - 3} textAnchor="middle" fontSize="12" fill={s.color}>
                              {d[s.key]}
                            </text>
                          )}
                        </g>
                      );
                    })}
                    <text
                      x={groupCenter}
                      y={topPad + chartH + 18}
                      textAnchor="middle"
                      fontSize="12"
                      fill="#64748b"
                    >
                      {MONTHS[Number(d.m.slice(5, 7)) - 1]}/{d.m.slice(2, 4)}
                    </text>
                  </g>
                );
              })}
              <line x1={leftPad} y1={topPad + chartH} x2={width - rightPad} y2={topPad + chartH} stroke="#e2e8f0" strokeWidth="1" />
            </svg>
          </div>
          <div className="flex items-center gap-4 text-sm text-slate-500 mt-2">
            {series.map((s) => (
              <span key={s.key} className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-sm inline-block" style={{ backgroundColor: s.color }} /> {s.label}
              </span>
            ))}
            <span className="text-xs text-slate-400">% produtivo = indicadas que já agendaram ou fecharam ÷ total indicadas (cada caso conta 1 vez)</span>
          </div>
        </>
      )}
    </div>
  );
}

            </tr>
          </thead>
          <tbody>
            {items.map((c) => (
              <tr key={c.id} className="border-t border-slate-100">
                <td className="py-1.5 pr-2">{c.patientName}</td>
                {showDoctor && <td className="py-1.5 pr-2">{c.referringDoctor}</td>}
                <td className="py-1.5 pr-2">{currency(computeValues(c).doctor)}</td>
                <td className="py-1.5 pr-2">{c.paymentMethod || "—"}</td>
                <td className="py-1.5">
                  {c.hasInvoice === "com_nf" ? (
                    <Badge tone="teal">Com NF</Badge>
                  ) : c.hasInvoice === "sem_nf" ? (
                    <Badge tone="amber">Sem NF</Badge>
                  ) : (
                    "—"
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function ReportSection({ title, items, showDoctor }) {
  return (
    <div className="mb-6 break-inside-avoid">
      <h4 className="text-sm font-semibold text-slate-600 uppercase tracking-wide mb-2 border-b border-slate-200 pb-1">
        {title} ({items.length})
      </h4>
      {items.length === 0 ? (
        <p className="text-xs text-slate-400">Nenhum caso.</p>
      ) : (
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-xs text-slate-400">
              <th className="py-1 pr-2">Paciente</th>
              {showDoctor && <th className="py-1 pr-2">Médico</th>}
              <th className="py-1 pr-2">Cirurgia</th>
              <th className="py-1 pr-2">Data</th>
              <th className="py-1 pr-2">Estágio</th>
              <th className="py-1 pr-2">Lançado em</th>
              <th className="py-1 pr-2">Hospital</th>
              <th className="py-1 pr-2">Médico (valor)</th>
              <th className="py-1 pr-2">Anestesista</th>
              <th className="py-1 pr-2">Forma de pagamento</th>
              <th className="py-1">NF</th>
            </tr>
          </thead>
          <tbody>
            {items.map((c) => {
              const v = computeValues(c);
              const totalCols = 9 + (showDoctor ? 1 : 0);
              return (
                <React.Fragment key={c.id}>
                  <tr className="border-t border-slate-100">
                    <td className="py-1.5 pr-2">{c.patientName}</td>
                    {showDoctor && <td className="py-1.5 pr-2">{c.referringDoctor}</td>}
                    <td className="py-1.5 pr-2">{c.surgeryType || "—"}</td>
                    <td className="py-1.5 pr-2">{c.surgeryDate || "—"}</td>
                    <td className="py-1.5 pr-2">{STAGES.find((s) => s.key === c.stage)?.label}</td>
                    <td className="py-1.5 pr-2">{c.createdAt ? new Date(c.createdAt).toLocaleDateString("pt-BR") : "—"}</td>
                    <td className="py-1.5 pr-2">{currency(v.hospital)}</td>
                    <td className="py-1.5 pr-2">{currency(v.doctor)}</td>
                    <td className="py-1.5 pr-2">{currency(v.anesth)}</td>
                    <td className="py-1.5 pr-2">{c.paymentMethod || "—"}</td>
                    <td className="py-1.5">
                      {c.hasInvoice === "com_nf" ? (
                        <Badge tone="teal">Com NF</Badge>
                      ) : c.hasInvoice === "sem_nf" ? (
                        <Badge tone="amber">Sem NF</Badge>
                      ) : (
                        "—"
                      )}
                    </td>
                  </tr>
                  {title === "Pendentes" && c.negotiationAttempts && (
                    <tr className="border-t border-dashed border-slate-100">
                      <td colSpan={totalCols} className="pb-2 pt-0.5 pr-2 text-xs text-slate-500 italic">
                        Tentativas de negociação: {c.negotiationAttempts}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>
</body>
</html>
